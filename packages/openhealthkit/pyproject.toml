[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openhealthkit"
version = "0.1.0"
description = "An offline-first open-source toolkit for building resilient community and public-health applications."
readme = "README.md"
authors = [
    { name = "Anannya Mahajan" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = [
    "health-tech",
    "offline-first",
    "fastapi",
    "sqlite",
    "postgresql",
    "synchronization",
    "public-health",
    "community-health",
    "developer-toolkit"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pyjwt[crypto]>=2.8.0",
    "pwdlib[argon2,bcrypt]>=0.2.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.9", "asyncpg>=0.29.0"]
redis = ["redis>=5.0.3"]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[project.scripts]
openhealthkit = "openhealthkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openhealthkit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=openhealthkit --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
