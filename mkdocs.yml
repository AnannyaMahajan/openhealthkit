site_name: OpenHealthKit Documentation
site_description: An offline-first open-source toolkit for building resilient community and public-health applications.
site_author: Anannya Mahajan
repo_url: https://github.com/anannyamahajan/openhealthkit
repo_name: openhealthkit

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: emerald
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: emerald
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Authentication & RBAC: authentication.md
  - Offline Synchronization: synchronization.md
  - Alert Engine: alerts.md
  - Analytics: analytics.md
  - Plugin System: plugins.md
  - Security Guidelines: security.md
  - Deployment & Docker: deployment.md
  - Contributing: contributing.md

plugins:
  - search
