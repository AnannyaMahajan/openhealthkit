name: Linting & Type Checking

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint & Type Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e "./packages/openhealthkit"

      - name: Run Ruff Lint Checks
        run: |
          ruff check packages/openhealthkit/src

      - name: Run Mypy Type Analysis
        run: |
          mypy packages/openhealthkit/src/openhealthkit
